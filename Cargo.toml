[workspace]
members = [
  "crates/mplot-core",
  "crates/mplot-cli",
]
resolver = "2"

[workspace.package]
version = "0.9.9"
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.88"
repository = "https://github.com/mplot-dev/mplot"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
blake3 = "1.8"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
mime_guess = "2.0"
parking_lot = "0.12"
postcard = { version = "1.1", features = ["alloc"] }
proptest = "1.7"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
zstd = "0.13"
