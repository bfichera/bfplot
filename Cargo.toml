[workspace]
members = [
  "crates/bfplot-core",
  "crates/bfplot-cli",
]
resolver = "2"

[workspace.package]
version = "0.9.9"
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.88"
repository = "https://github.com/bfplot-dev/bfplot"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread"] }
toml = "0.9"
