# Release BFPlot: Actions → Release → Run workflow, type the version, press Run.
#
# The workflow sets that version everywhere, builds and tests every package, and only if
# all of it passes commits the version to main, tags it, creates the GitHub release and
# publishes to PyPI (and crates.io, if a CARGO_REGISTRY_TOKEN secret exists). Tick
# "dry run" to do everything except publishing. Pull requests that touch packaging run
# the build and tests too. See RELEASING.md.
#
# The `bfplot` app is compiled once per platform, as a bfplot-cli wheel; the macOS and
# static Linux binaries are repackaged as the archives that install.sh downloads.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, such as 1.0.0 (or 1.1.0-rc.1 for a pre-release)"
        required: true
        type: string
      dry-run:
        description: "Dry run: build and test everything, publish nothing"
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      # The version without a leading "v"; empty for pull requests.
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install packaging
      - name: Releases come from main and use a new version
        id: version
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="$(echo "$VERSION" | tr -d '[:space:]')"
          VERSION="${VERSION#v}"
          if [[ "$GITHUB_REF" != refs/heads/main && "${{ inputs.dry-run }}" != true ]]; then
            echo "::error::Run releases from the main branch (this is $GITHUB_REF_NAME)."; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION has already been released; pick a new version."; exit 1
          fi
          python scripts/set_version.py "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: python scripts/check_versions.py

  cli-wheels:
    name: bfplot-cli wheel (${{ matrix.name }})
    needs: plan
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: manylinux x86_64, runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: auto, native: true }
          - { name: manylinux aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: auto, native: true }
          - { name: musllinux x86_64, runner: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2, native: false, archive: true }
          - { name: musllinux aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2, native: false, archive: true }
          - { name: macOS x86_64, runner: macos-15-intel, target: x86_64-apple-darwin, manylinux: "", native: true, archive: true }
          - { name: macOS arm64, runner: macos-latest, target: aarch64-apple-darwin, manylinux: "", native: true, archive: true }
          - { name: Windows x64, runner: windows-latest, target: x86_64-pc-windows-msvc, manylinux: "", native: true }
          - { name: Windows arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc, manylinux: "", native: true }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Set the version
        if: env.VERSION != ''
        shell: bash
        run: python -m pip install -q packaging && python scripts/set_version.py "$VERSION"
      - name: Stage crate files
        shell: bash
        run: bash scripts/stage-crates.sh
      # Linux wheels build in maturin's manylinux/musllinux containers; elsewhere maturin
      # builds on the runner, which needs rustup (windows-11-arm has none preinstalled).
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux'
        with:
          targets: ${{ matrix.target }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist -m crates/bfplot-cli/Cargo.toml
      - name: Install the wheel and run the app
        if: matrix.native
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [[ "$RUNNER_OS" == Windows ]]; then bin="$RUNNER_TEMP/venv/Scripts"; else bin="$RUNNER_TEMP/venv/bin"; fi
          "$bin/python" -m pip install --no-index --find-links dist bfplot-cli
          "$bin/bfplot" --version
      - uses: actions/upload-artifact@v7
        with:
          name: cli-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
      # The musl builds are statically linked, so one Linux archive per CPU runs anywhere.
      - name: Package the app for install.sh
        if: matrix.archive
        run: |
          mkdir -p "$RUNNER_TEMP/app" archives
          unzip -j -o dist/*.whl '*.data/scripts/bfplot' -d "$RUNNER_TEMP/app"
          chmod 755 "$RUNNER_TEMP/app/bfplot"
          cp LICENSE-APACHE LICENSE-MIT "$RUNNER_TEMP/app/"
          name="bfplot-${{ matrix.target }}.tar.gz"
          tar -czf "archives/$name" -C "$RUNNER_TEMP/app" bfplot LICENSE-APACHE LICENSE-MIT
          (cd archives && shasum -a 256 "$name" > "$name.sha256")
      - name: install.sh and uninstall.sh work
        if: matrix.archive
        run: |
          export BFPLOT_DOWNLOAD_URL="file://$PWD/archives" BFPLOT_INSTALL_DIR="$RUNNER_TEMP/bin"
          sh scripts/install.sh
          "$BFPLOT_INSTALL_DIR/bfplot" --version
          sh scripts/uninstall.sh
          test ! -e "$BFPLOT_INSTALL_DIR/bfplot"
      - uses: actions/upload-artifact@v7
        if: matrix.archive
        with:
          name: app-${{ matrix.target }}
          path: archives/*
          if-no-files-found: error

  sdists:
    name: bfplot sdists and pure-Python wheel
    needs: plan
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build "maturin>=1.9,<2" packaging
      - name: Set the version
        if: env.VERSION != ''
        run: python scripts/set_version.py "$VERSION"
      - name: Stage crate files
        run: bash scripts/stage-crates.sh
      - name: bfplot-cli sdist
        run: maturin sdist -m crates/bfplot-cli/Cargo.toml --out dist-cli
      - name: bfplot wheel and sdist
        run: python -m build --outdir dist-py .
      - uses: actions/upload-artifact@v7
        with:
          name: cli-sdist
          path: dist-cli/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: python-dists
          path: dist-py/*
          if-no-files-found: error

  check:
    name: Check and test-install the packages
    needs: [plan, cli-wheels, sdists]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: dist-cli
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: python-dists
          path: dist-py
      - run: python -m pip install twine
      - run: twine check --strict dist-cli/* dist-py/*
      - name: pip install bfplot gives the writer and the app
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --only-binary bfplot-cli --find-links dist-cli --find-links dist-py bfplot
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" -c "
          import matplotlib; matplotlib.use('Agg')
          import matplotlib.pyplot as plt, bfplot
          fig, ax = plt.subplots(); ax.plot([1, 2, 3], [1, 4, 9])
          bfplot.savefig('check.bfplot', fig)
          bfplot.savefig('check-packed.bfplot', fig, layout='file')
          "
          "$RUNNER_TEMP/venv/bin/bfplot" verify check.bfplot
          "$RUNNER_TEMP/venv/bin/bfplot" verify check-packed.bfplot
      - name: The packages carry the requested version
        if: env.VERSION != ''
        run: |
          test "$("$RUNNER_TEMP/venv/bin/bfplot" --version)" = "bfplot-cli $VERSION"
          "$RUNNER_TEMP/venv/bin/python" -c "
          import bfplot, sys
          from packaging.version import Version
          sys.exit(Version(bfplot.__version__) != Version('$VERSION'))
          "
      - name: The bfplot-cli sdist builds on its own
        run: |
          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip install --no-binary bfplot-cli dist-cli/*.tar.gz
          "$RUNNER_TEMP/sdist-venv/bin/bfplot" --version

  release:
    name: Commit, tag and create the GitHub release
    needs: [plan, check]
    if: github.event_name == 'workflow_dispatch' && !inputs.dry-run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install packaging
      - uses: actions/download-artifact@v8
        with:
          pattern: app-*
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Commit the version and tag it
        run: |
          python scripts/set_version.py "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release $VERSION" || echo "the version was already $VERSION"
          git tag -a "v$VERSION" -m "BFPlot $VERSION"
          # Fails, publishing nothing, if main moved on while this ran; just run it again.
          git push origin HEAD:main "v$VERSION"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp scripts/install.sh scripts/uninstall.sh "$RUNNER_TEMP/release/"
          # A pre-release (1.1.0-rc.1) is skipped by releases/latest, and so by install.sh.
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "v$VERSION" --verify-tag --title "BFPlot $VERSION" \
            --generate-notes "${prerelease[@]}" "$RUNNER_TEMP"/release/*

  publish-pypi:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bfplot/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: dist-cli
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: python-dists
          path: dist-py
      # bfplot-cli first, so `pip install bfplot` never sees bfplot without its app.
      - name: Publish bfplot-cli
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-cli/
      - name: Publish bfplot
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-py/

  publish-crates:
    name: Publish to crates.io
    needs: [plan, release]
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.plan.outputs.version }}
          persist-credentials: false
      - name: Skip without a crates.io token
        if: env.CARGO_REGISTRY_TOKEN == ''
        run: echo "::notice::No CARGO_REGISTRY_TOKEN secret, so the crates were not published."
      - uses: dtolnay/rust-toolchain@stable
        if: env.CARGO_REGISTRY_TOKEN != ''
      # bfplot-cli depends on bfplot-core, so bfplot-core goes first. --allow-dirty because
      # the staged license texts and viewer are ignored by Git.
      - name: Publish bfplot-core and bfplot-cli
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          bash scripts/stage-crates.sh
          cargo publish --locked --allow-dirty -p bfplot-core
          cargo publish --locked --allow-dirty -p bfplot-cli
