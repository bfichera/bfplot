[package]
name = "bfplot-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The bfplot app: view, serve, verify and pack BFPlot results"
readme = "README.md"
keywords = ["plotting", "visualization", "scientific", "viewer", "matplotlib"]
categories = ["command-line-utilities", "visualization", "science"]
# viewer/ and the license texts are staged by scripts/stage-crates.sh and ignored by Git.
include = [
  "/src/**/*.rs",
  "/build.rs",
  "/viewer/**/*",
  "/README.md",
  "/pyproject.toml",
  "/LICENSE-APACHE",
  "/LICENSE-MIT",
]

[[bin]]
name = "bfplot"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
bfplot-core = { version = "0.9.9", path = "../bfplot-core" }
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true

[dev-dependencies]
toml.workspace = true
