[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mplot"
version = "0.9.9"
description = "Language-neutral interactive scientific plot artifacts"
readme = "ARCHITECTURE.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "MPlot contributors" }]
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "zstandard>=0.21",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "ruff>=0.14"]
docs = ["mkdocs-material>=9.6,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/mplot"]

[tool.hatch.build.targets.wheel.force-include]
"src/mplot/py.typed" = "mplot/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
