# The pure-Python `bfplot` writer. The app it opens results with comes from the
# `bfplot-cli` package (crates/bfplot-cli), released with the same version.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bfplot"
version = "0.9.9"
description = "Save Matplotlib figures as interactive, reproducible scientific results"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 OR MIT"
license-files = ["LICENSE", "LICENSE-APACHE", "LICENSE-MIT"]
authors = [{ name = "BFPlot contributors" }]
keywords = ["plotting", "visualization", "matplotlib", "scientific", "reproducibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Matplotlib",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Visualization",
  "Typing :: Typed",
]
dependencies = [
  # Keep in step with the version above; scripts/check_versions.py checks it.
  "bfplot-cli==0.9.9",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "zstandard>=0.21",
]

[project.urls]
Homepage = "https://bfichera.github.io/bfplot/"
Documentation = "https://bfichera.github.io/bfplot/"
Repository = "https://github.com/bfichera/bfplot"
Issues = "https://github.com/bfichera/bfplot/issues"
Changelog = "https://github.com/bfichera/bfplot/releases"

# Development only (PEP 735, `pip install --group test`); not part of the published metadata.
[dependency-groups]
test = ["pytest>=8", "pytest-cov>=5", "ruff>=0.14", "tomli>=2; python_version < '3.11'"]
docs = ["mkdocs-material>=9.6,<10"]
release = ["build>=1.2", "maturin>=1.9,<2", "packaging>=24", "twine>=6"]
dev = [{ include-group = "test" }, { include-group = "docs" }, { include-group = "release" }]

[tool.hatch.build.targets.wheel]
packages = ["src/bfplot"]

[tool.hatch.build.targets.wheel.force-include]
"src/bfplot/py.typed" = "bfplot/py.typed"

[tool.hatch.build.targets.sdist]
include = ["/src/bfplot", "/tests", "/examples", "/README.md", "/LICENSE*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
